server {
    listen 80;

    client_max_body_size 100m;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    location / {
        # The upstream whisper server emits its OWN CORS headers (it echoes the
        # request origin and sets allow-credentials). If we add ours on top, the
        # ACAO header ends up with TWO values ('*, https://...') and the browser
        # rejects it. Strip the upstream's CORS headers so only ours remain.
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header access-control-allow-origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header access-control-allow-credentials;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header access-control-allow-methods;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header access-control-allow-headers;

        # CORS preflight
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
            add_header Access-Control-Allow-Headers "Content-Type, Authorization";
            add_header Access-Control-Max-Age 600;
            return 204;
        }

        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;

        proxy_pass http://whisper:8000;
        proxy_http_version 1.1;
    }
}